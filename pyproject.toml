[project]
name = "bone-predictor"
version = "0.1.0"
description = "Bayesian mechanistic modeling for bone turnover suppression and Hawkins PET kinetics"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "pymc>=6.1.0",
    "bambi>=0.19.0",
    "nutpie",
    "arviz-base>=1.0.0",
    "arviz-stats>=1.0.0",
    "arviz-plots>=1.0.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "openpyxl>=3.1.5",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "matplotlib",
    "xarray",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.16.0",
    "ipykernel",
    "nbformat>=5.10.4",
    "nbclient>=0.11.0",
    "jupyter",
]

[project.scripts]
bone-predictor = "bone_predictor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bone_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full MCMC sampling tests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
